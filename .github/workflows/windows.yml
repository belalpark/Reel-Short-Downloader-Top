name: Test and build Windows

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript regression tests
        run: node --test tests/extension.test.cjs
      - name: Parse Windows scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Offline browser integration
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore

  windows:
    needs: [tests, browser]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r build-requirements.txt
      - name: Test Edge extension installation without a PIN
        run: python -m scripts.test_edge_setup
      - name: Download and verify pinned tools
        shell: pwsh
        run: ./scripts/Download-Dependencies.ps1
      - name: Build self-contained application
        run: python scripts/package.py
      - name: Test packaged runtime and real GUI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $exe = (Resolve-Path 'dist/ReelShortDownloaderTop/ReelShortDownloaderTop.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--check-runtime --report test-results/runtime.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content test-results/runtime.json; throw 'Packaged runtime check failed' }
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test --report test-results/gui.json --screenshot test-results/gui.png' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path test-results/gui.json)) { throw 'Packaged GUI smoke test failed' }
      - name: Test real downloads using bundled tools
        run: python -m scripts.smoke_download --root dist/ReelShortDownloaderTop --report test-results/download.json
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 compiler is missing from runner' }
          & $iscc installer/ReelShortDownloaderTop.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Test installer and bundled requirements
        shell: pwsh
        run: ./scripts/Test-Installer.ps1
      - name: Test interactive installation and normal app launch
        run: python -m scripts.test_installer_ui
      - name: Create portable archive and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ReelShortDownloaderTop -DestinationPath release/ReelShortDownloaderTop-Portable-0.2.0-win-x64.zip
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-evidence
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ReelShortDownloaderTop-Windows-x64
          path: release/
          retention-days: 30

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ReelShortDownloaderTop-Windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: release/*
          body: |
            Windows preview with a three-step interface, automatic extension authorization and inbox downloads.
            Automated checks cover the package, installer, normal Edge extension setup and offline retry/cancel behavior.
            Real ReelShort account playback and Windows 10/11 acceptance remain separate requirements.
